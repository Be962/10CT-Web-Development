<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Rome</title>
        <link rel="stylesheet" href="../CSS/style.css">
        <link rel="stylesheet" href="../CSS/Pt1.css">

    <body>
        <div class="overlayText textRange1 fadeText">
            <h1>Welcome</h1>
        </div>
        <div class="overlayText textRange2 fadeText">
            <h1>To the greatest civilisation of all time</h1>
        </div>
        <div class="overlayText textRange3 fadeText" style="letter-spacing: 20px">
            <h1 style="font-size: 240px;">Rome</h1>

        <div class="overlayText captionsRange1 fadeText">
            <h2 style="color:white">Colosseum Square</h2>

        <div class="overlayText nextPageRange buttonState nextPageButton">

        <section class="vid vid1">

                <video src="../Media/Rome1.mp4" autoplay muted loop playsinline></video>
